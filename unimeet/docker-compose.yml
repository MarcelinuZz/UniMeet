version: '3.8'

services:
  mariadb:
    image: mariadb:11
    container_name: unimeet-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: unimeet_db
    ports:
      - '3306:3306'
    volumes:
      - mariadb_data:/var/lib/mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unimeet-backend
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "mysql://root:@mariadb:3306/unimeet_db"
      JWT_SECRET: "unimeet-super-secret-jwt-key-binus-2025"
      JWT_REFRESH_SECRET: "unimeet-super-secret-refresh-key-binus-2025"
    ports:
      - '3000:3000'

volumes:
  mariadb_data:
